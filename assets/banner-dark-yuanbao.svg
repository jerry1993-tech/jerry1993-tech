<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cornucopia.AI — AI Full-Stack Engineer</title>
  <desc id="desc">Dark profile banner for Cornucopia.AI, AI Full-Stack Engineer, focused on LLM, Agents, and Agentic RL, with a golden bowl filled with yuanbao.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="0" x2="1240" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1526"/>
      <stop offset="1" stop-color="#070B13"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 80) rotate(90) scale(330 420)">
      <stop stop-color="#D4A24C" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#D4A24C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(140 360) rotate(-40) scale(300 460)">
      <stop stop-color="#2F8F83" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2F8F83" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldName" x1="0" y1="160" x2="0" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7DCA4"/>
      <stop offset="0.55" stop-color="#D4A24C"/>
      <stop offset="1" stop-color="#B4861E"/>
    </linearGradient>
    <linearGradient id="bowlGold" x1="958" y1="228" x2="1122" y2="276" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7DCA4"/>
      <stop offset="0.35" stop-color="#D4A24C"/>
      <stop offset="0.72" stop-color="#B4861E"/>
      <stop offset="1" stop-color="#8A5E12"/>
    </linearGradient>
    <linearGradient id="bowlDark" x1="996" y1="270" x2="1084" y2="288" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B4861E"/>
      <stop offset="1" stop-color="#7A5210"/>
    </linearGradient>
    <linearGradient id="rimGold" x1="958" y1="228" x2="1122" y2="244" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7DCA4"/>
      <stop offset="0.5" stop-color="#D4A24C"/>
      <stop offset="1" stop-color="#A9791E"/>
    </linearGradient>
    <linearGradient id="ingotTop" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFF3D0"/>
      <stop offset="0.55" stop-color="#E8C477"/>
      <stop offset="1" stop-color="#C08A2E"/>
    </linearGradient>
    <linearGradient id="ingotBase" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E8C477"/>
      <stop offset="1" stop-color="#9A6A12"/>
    </linearGradient>
    <radialGradient id="bowlGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 232) scale(120 92)">
      <stop stop-color="#D4A24C" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#D4A24C" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bowlClip">
      <rect x="930" y="140" width="220" height="120"/>
    </clipPath>
    <g id="yuanbao">
      <path d="M -36 12 C -32 26 -18 32 0 32 C 18 32 32 26 36 12 C 26 20 14 24 0 24 C -14 24 -26 20 -36 12 Z" fill="url(#ingotBase)" stroke="#6E4A0E" stroke-opacity="0.55" stroke-width="1"/>
      <path d="M -30 22 Q 0 30 30 22" stroke="#F7DCA4" stroke-opacity="0.45" stroke-width="1" fill="none"/>
      <path d="M -25 12 L -19 -2 C -16 -8 -8 -10 0 -10 C 8 -10 16 -8 19 -2 L 25 12 C 20 24 -20 24 -25 12 Z" fill="url(#ingotTop)" stroke="#7A5210" stroke-opacity="0.45" stroke-width="1"/>
      <path d="M -17 -3 C -8 0 8 0 17 -3" stroke="#F7DCA4" stroke-opacity="0.55" stroke-width="1" fill="none"/>
      <ellipse cx="-8" cy="-4" rx="7" ry="3" fill="#FFF8E7" opacity="0.8"/>
    </g>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="360" rx="22"/>
    </clipPath>
