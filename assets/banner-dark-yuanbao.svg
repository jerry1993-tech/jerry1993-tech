      <ellipse cx="1040" cy="230" rx="116" ry="88" fill="url(#bowlGlow)"/>
      <ellipse cx="1040" cy="290" rx="56" ry="5" fill="#000000" opacity="0.28"/>

      <g>
        <path d="M 1002 268 C 998 276 996 282 994 288 L 1086 288 C 1084 282 1082 276 1078 268 Z" fill="url(#bowlDark)" stroke="#6E4A0E" stroke-opacity="0.5"/>
        <path d="M 996 287 C 1014 291 1066 291 1084 287" stroke="#F7DCA4" stroke-opacity="0.35" stroke-width="1.5" fill="none"/>

        <path d="M 958 228 C 962 254 984 274 1040 276 C 1096 274 1118 254 1122 228 Z" fill="url(#bowlGold)" stroke="#7A5210" stroke-opacity="0.55" stroke-width="1.2"/>
        <path d="M 974 240 C 980 258 996 268 1020 272" stroke="#FFF3D0" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M 996 266 C 1014 272 1066 272 1084 266" stroke="#F7DCA4" stroke-opacity="0.4" stroke-width="1.2" fill="none"/>

        <ellipse cx="1040" cy="228" rx="82" ry="16" fill="#6E4A0E"/>
        <ellipse cx="1040" cy="226" rx="78" ry="12" fill="#8A5E12" opacity="0.8"/>
        <path d="M 958 228 A 82 16 0 0 1 1122 228" stroke="#FFF3D0" stroke-opacity="0.6" stroke-width="1.4" fill="none"/>

        <g clip-path="url(#bowlClip)">
          <use href="#yuanbao" transform="translate(1040 168) scale(1.08)"/>
          <use href="#yuanbao" transform="translate(997 188) scale(0.95) rotate(-6)"/>
          <use href="#yuanbao" transform="translate(1083 188) scale(0.95) rotate(6)"/>
          <use href="#yuanbao" transform="translate(1015 220) scale(1.02) rotate(-2)"/>
          <use href="#yuanbao" transform="translate(1065 220) scale(1.02) rotate(2)"/>
          <use href="#yuanbao" transform="translate(1040 226) scale(0.82)"/>
        </g>

        <path d="M 958 228 A 82 16 0 0 0 1122 228 L 1122 244 A 82 16 0 0 1 958 244 Z" fill="url(#rimGold)" stroke="#7A5210" stroke-opacity="0.7" stroke-width="1"/>
        <path d="M 958 228 A 82 16 0 0 0 1122 228" stroke="#FFF3D0" stroke-opacity="0.55" stroke-width="1.4" fill="none"/>
      </g>

      <path d="M1196 110 l4.5 11 11 4.5 -11 4.5 -4.5 11 -4.5 -11 -11 -4.5 11 -4.5z" fill="#D4A24C" fill-opacity="0.8"/>
      <circle cx="894" cy="93" r="2" fill="#8FA2BC"/>
    </g>
  </g>
